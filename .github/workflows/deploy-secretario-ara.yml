name: Deploy Secretario Ara to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'ara/**'
    paths:
      - 'workers/secretario/**'
      - '.github/workflows/deploy-secretario-ara.yml'

concurrency:
  group: secretario-ara-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/secretario
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/secretario/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test planning and dashboard
        run: node --test tests/*.test.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env ara

      - name: Deploy Worker
        run: npx wrangler deploy --env ara

      - name: Verify production health
        working-directory: .
        run: |
          for attempt in $(seq 1 12); do
            health="$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' "https://ara.nuviamedia.com/health?deploy=${GITHUB_SHA}&attempt=${attempt}")" || true
            if printf '%s' "$health" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const h=JSON.parse(s);if(h.ok&&h.checks?.database&&h.checks?.durableObject&&h.checks?.telegramWebhook&&h.queue)process.exit(0)}catch{}process.exit(1)})'; then
              printf '%s' "$health" | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>console.log(JSON.stringify(JSON.parse(s),null,2)))'
              exit 0
            fi
            sleep 3
          done
          printf '%s\n' "$health"
          echo 'La versión nueva no superó la verificación integral de producción.' >&2
          exit 1
