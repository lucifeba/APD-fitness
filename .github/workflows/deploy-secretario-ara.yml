name: Deploy Secretario Ara to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'ara/**'
    paths:
      - 'workers/secretario/**'
      - '.github/workflows/deploy-secretario-ara.yml'

concurrency:
  group: secretario-ara-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/secretario
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/secretario/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test planning and dashboard
        run: node --test tests/*.test.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env ara

      - name: Deploy Worker
        run: npx wrangler deploy --env ara
