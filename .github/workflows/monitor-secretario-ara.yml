name: Monitor Arabot production

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: monitor-secretario-ara
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check complete production health
        run: |
          health="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --header 'Cache-Control: no-cache' "https://ara.nuviamedia.com/health?monitor=${GITHUB_RUN_ID}")"
          printf '%s' "$health" | node -e '
            let source="";
            process.stdin.on("data",chunk=>source+=chunk);
            process.stdin.on("end",()=>{
              const h=JSON.parse(source);
              console.log(JSON.stringify(h,null,2));
              const c=h.checks||{};
              const required=["paired","database","durableObject","telegramWebhook","googleOAuth","chatgptOAuth","workersAI","gemini"];
              const missing=required.filter(key=>c[key]!==true);
              if(!h.ok||missing.length||Number(h.queue?.failed||0)>0||Number(c.telegramPending||0)>20){
                console.error(`Arabot degradado. Checks: ${missing.join(", ")||"ninguno"}; cola fallida: ${h.queue?.failed||0}; Telegram pendiente: ${c.telegramPending||0}`);
                process.exit(1);
              }
            });
          '
